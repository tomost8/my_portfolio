name: Merge passing pull request

# Starts only after CI finishes successfully on a pull request. It merge-commits
# the pull request if its head is still the commit CI validated.
#
# Eligible pairs:
#   - a feat/ fix/ docs/ ci/ build/ branch into dev
#   - dev into main
# Anything else (for example dependabot branches) is left alone.
#
# GitHub runs workflow_run workflows from the default branch, so this file has
# to be on main before it can start.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read

jobs:
  merge:
    name: Merge
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Merge the validated pull request
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.workflow_run.pull_requests[0].number }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::The GH_TOKEN repository secret is missing."
            exit 1
          fi
          if [ -z "${PR:-}" ]; then
            echo "No pull request is attached to this run."
            exit 0
          fi

          read -r state head base oid < <(gh pr view "$PR" --json state,headRefName,baseRefName,headRefOid \
            --jq '[.state, .headRefName, .baseRefName, .headRefOid] | @tsv')

          if [ "$state" != "OPEN" ]; then
            echo "Pull request #$PR is $state."
            exit 0
          fi

          eligible="no"
          if [ "$base" = "dev" ] && [[ "$head" =~ ^(feat|fix|docs|ci|build)/ ]]; then eligible="yes"; fi
          if [ "$base" = "main" ] && [ "$head" = "dev" ]; then eligible="yes"; fi
          if [ "$eligible" != "yes" ]; then
            echo "Pull request #$PR ($head into $base) is not eligible for an automatic merge."
            exit 0
          fi

          if [ "$oid" != "$HEAD_SHA" ]; then
            echo "Pull request #$PR moved on since CI ran ($oid, CI validated $HEAD_SHA). A newer run will decide."
            exit 0
          fi

          gh pr merge "$PR" --merge --match-head-commit "$HEAD_SHA"
